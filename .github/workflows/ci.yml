name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Node 24 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run compatibility and reliability tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Test weekly raid workflow and safe example
        run: npm run test:raid-workflow

  required-validation:
    name: Validate Node 24 project
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both platform validations
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = "success"
